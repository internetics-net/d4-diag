[tool.poetry]
name = "d4-diag"
version = "0.1.6"
# git tag v0.1.6 & git push origin v0.1.6
description = "Python code visualization tool that generates interactive Mermaid diagrams from static analysis"
authors = ["Pedja Blagojevic <pb@internetics.net>"]
readme = "README.md"
packages = [{include = "d4_diag", from = "src"}]

[tool.poetry.dependencies]
python = "^3.8.1"
click = "^8.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.0"
pytest = "^7.0.0"
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
pre-commit = "^3.5.0"

[tool.poetry.scripts]
main = "d4_diag.main:main"
d4-diag = "d4_diag.main:main"
view = "d4_diag.viewer_mermaid:main"
test = "tests.run_tests:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# E203/E501: formatter; E402: late imports (same ignores as former .flake8)
ignore = ["E203", "E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
